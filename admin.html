<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="admin-wrap"><div class="admin-nav"><div><div class="eyebrow">Menu Platform</div><h1 style="margin:4px 0">لوحة إدارة المنيو</h1></div><a class="btn secondary" href="index.html">عرض المنيو</a></div><div class="notice">هذه نسخة MVP تعمل محليًا على المتصفح. عند ربط Supabase ستصبح البيانات مشتركة وقابلة للإدارة من أي جهاز.</div><section class="admin-card"><h2>بيانات النشاط</h2><div class="form-grid"><div class="field"><label>اسم النشاط</label><input id="brandName"></div><div class="field"><label>الشعار/الحرف</label><input id="brandLogo"></div><div class="field"><label>الوصف</label><input id="tagline"></div><div class="field"><label>Google Maps</label><input id="maps"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div></div><br><button class="btn" id="saveBrand">حفظ البيانات</button></section><section class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>المنتجات</h2><button class="btn" id="addItem">+ إضافة منتج</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>المنتج</th><th>الفئة</th><th>السعر</th><th>متاح</th><th></th></tr></thead><tbody id="items"></tbody></table></div></section><section class="admin-card" id="editor" hidden><h2 id="editorTitle">إضافة منتج</h2><div class="form-grid"><div class="field"><label>الاسم بالعربية</label><input id="ar"></div><div class="field"><label>Name (English)</label><input id="en"></div><div class="field"><label>الوصف</label><textarea id="desc"></textarea></div><div class="field"><label>السعر</label><input id="price" type="number"></div><div class="field"><label>الفئة</label><select id="cat"></select></div><div class="field"><label>رابط الصورة</label><input id="img"></div></div><br><label><input id="available" type="checkbox" checked> متوفر</label><br><br><button class="btn" id="saveItem">حفظ</button> <button class="btn secondary" id="cancel">إلغاء</button></section></div><script src="admin.js"></script></body></html>
